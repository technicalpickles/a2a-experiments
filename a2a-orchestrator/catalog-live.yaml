# A static catalog of real a2acodes (each serves a card but no GET / index),
# one entry per process/port/cwd. Use with: uv run orch-serve --catalog catalog-live.yaml
provider: static
repos:
  - name: demo-app
    description: Real a2acode (claude backend) editing ~/scratch/demo-app
    card_url: http://127.0.0.1:9100/.well-known/agent-card.json
  - name: demo-notes
    description: Real a2acode (claude backend) editing ~/scratch/demo-notes
    card_url: http://127.0.0.1:9101/.well-known/agent-card.json
