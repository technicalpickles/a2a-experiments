# The catch-all lives alone so a new scenario file can be dropped in without
# reordering anything. Files load in filename order and their plays
# concatenate, so a catch-all sharing a file with real plays shadows every
# file that sorts after it.
plays:
  # A run that dies partway, as the default: a consumer gets a failing repo
  # without having to know a magic phrase.
  - match: {}
    events:
      - tool_use: { name: Bash, input: { command: "terraform init" }, id: t1 }
      - tool_result:
          id: t1
          name: Bash
          failed: true
          output: "Error: Failed to query available provider packages"
      - error: "terraform init could not reach the provider registry"
