# Recorded from a real Claude Code run over ACP, then scrubbed and promoted.
# `rig-record --backend acp --agent claude` against the demo-app Flask fixture;
# see docs/DEVLOG.md for the run and a2a-rig/README.md for the refresh loop.
#
# THIS IS THE RECORDING THAT CARRIES `plan` EVENTS. Three of them, showing a
# plan being revised mid-turn: steps merge and statuses walk pending ->
# in_progress -> completed. a2acode replaces the plan artifact on every
# update rather than stacking copies, so a consumer that renders the last
# one wins. The earlier health recording has none, because plan events come
# from the agent calling TodoWrite and a one-step task never bothers --
# task size is the knob, not permission mode.
#
# Three permission gates, all answered `allow` in the live run, so every
# `permission` here carries `on_allow` and no `on_deny`. Denying on replay
# raises rather than inventing a branch that never happened.
#
# `tool_use.input` is empty on every entry and `tool_result.name` is blank:
# that is a2acode's ACP backend dropping tool-call arguments, not the
# recorder losing them. The permission events from the same turn carry full
# args, which is what proves it a mapping gap. See docs/UPSTREAM.md.
#
# Interpreter paths in the pytest output read `/opt/venv` because the live
# agent inherited the recording harness's virtualenv -- an environment bleed
# from rig-record into the agent it records. Scrubbed by hand; scrub_cwd
# only rewrites paths under the agent's --cwd.
