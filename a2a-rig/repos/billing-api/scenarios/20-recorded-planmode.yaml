# Recorded from a real Claude Code run over ACP, then scrubbed and promoted.
# `rig-record --backend acp --agent claude` against the demo-app Flask fixture;
# see docs/DEVLOG.md for the run and a2a-rig/README.md for the refresh loop.
#
# THIS IS THE ONLY RECORDING WITH AN `on_deny` BRANCH, and the reason it is
# worth a slot: a denied gate here ends the task `completed`, not `failed`.
# Every hand-written deny in this repo fails the task, so a consumer built
# against those alone would treat deny as terminal. It is not.
#
# Recorded with `permissions.defaultMode: "plan"` in the agent's --cwd, so
# the gate is Claude Code's ExitPlanMode rather than an edit approval. Two
# things follow that a consumer has to handle:
#
#   - The gate's tool name is the UI label "Ready to code?", not a tool id,
#     and the proposed plan arrives as markdown in `input.plan`.
#   - ACP offers this gate THREE options (auto-accept edits / manually
#     approve / keep planning), but a2acode's PermissionDecision is a bool,
#     so `deny` selects the reject_once option -- which for this tool means
#     "no, keep planning" rather than "stop". The agent ends its turn by
#     asking what to change; the revision happens on the NEXT turn.
#
# Answering `allow` on replay raises rather than inventing the branch the
# live run never took.
#
# `planFilePath` and the plan's own file_change read `~/.claude/plans/...`
# because Claude Code writes the plan into its config dir under a random
# per-run slug -- outside --cwd, so scrub_cwd never saw it. Scrubbed by hand.
