        +++ b/~/.claude/plans/pagination-plan.md

        @@ -0,0 +1,86 @@

        +# Plan: Add pagination to /items endpoint

        +

        +## Context

        +

        +The demo app is a minimal Flask REST API with a hardcoded in-memory `ITEMS`
        list. The `/items` endpoint currently returns all items with no filtering.
        We''re adding standard `limit` and `offset` query params to support pagination,
        and documenting the API in README.md.

        +

        +## Files to modify

        +

        +- `app.py` -- route handler

        +- `README.md` -- API docs

        +

        +---

        +

        +## app.py changes

        +

        +Import `request` from flask, then update `list_items` to slice `ITEMS` using
        `limit` and `offset`:

        +

        +```python

        +from flask import Flask, jsonify, request

        +

        +@app.get("/items")

        +def list_items():

        +    limit = request.args.get("limit", default=None, type=int)

        +    offset = request.args.get("offset", default=0, type=int)

        +    items = ITEMS[offset:]

        +    if limit is not None:

        +        items = items[:limit]

        +    return jsonify(items)

        +```

        +

        +Defaults: `offset=0`, `limit=None` (no cap -- returns everything when omitted,
        preserving current behavior).

        +

        +---

        +

        +## README.md changes

        +

        +Replace the one-liner description with a proper API reference section:

        +

        +```markdown

        +# demo-app

        +

        +Tiny Flask app used as the scratch repo for a2a-experiments Phase 2.

        +

        +## API

        +

        +### GET /items

        +

        +Returns the list of items.

        +

        +**Query params:**

        +

        +| Param    | Type | Default | Description                          |

        +|----------|------|---------|--------------------------------------|

        +| `limit`  | int  | none    | Max number of items to return        |

        +| `offset` | int  | 0       | Number of items to skip from the start |

        +

        +**Examples:**

        +

        +```

        +GET /items           # all items

        +GET /items?limit=10  # first 10

        +GET /items?offset=5  # skip first 5

        +GET /items?limit=10&offset=5  # items 6-15

        +```

        +

        +### GET /items/:id

        +

        +Returns a single item by ID, or 404 if not found.

        +```

        +

        +---

        +

        +## Verification

        +

        +```bash

        +cd .

        +source .venv/bin/activate

        +flask run &

        +

        +curl localhost:5000/items

        +curl "localhost:5000/items?limit=1"

        +curl "localhost:5000/items?offset=1"

        +curl "localhost:5000/items?limit=1&offset=1"

        +```

        +

        +Expected: plain `/items` returns both items; `?limit=1` returns only the
        first; `?offset=1` skips the first; `?limit=1&offset=1` returns just the second.

        '
