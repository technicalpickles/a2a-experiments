# Recorded from a real Claude Code run over ACP, then scrubbed and promoted.
# `rig-record --backend acp --agent claude` against a small Flask app; see
# docs/DEVLOG.md for the run and a2a-rig/README.md for the refresh loop.
#
# Sorts at 20-* so it lands ahead of the hand-written plays: an imagined
# play shadowing a real recording of the same prompt is backwards.
#
# The permission carries `on_allow` and no `on_deny`, because the live run
# was answered once. Denying this prompt on replay raises rather than
# inventing a branch that never happened -- which is why recordings compose
# with hand-written plays instead of replacing them. The deny path, the
# abandoned-approval timeout, and scripted failures stay in 30-refactor.yaml.
#
# `input.file_path` reads `./app.py` because scrub_cwd rewrote the recording
# machine's absolute path; the live gate carried the full path.
