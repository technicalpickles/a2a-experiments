# The catch-all lives alone so a new scenario file can be dropped in without
# reordering anything. Files load in filename order and their plays
# concatenate, so a catch-all sharing a file with real plays shadows every
# file that sorts after it.
plays:
  # Catch-all. Must stay last: the loader rejects a non-final default, since
  # everything after it would be unreachable.
  - match: {}
    events:
      - tool_use: { name: Read, input: { file_path: "README.md" }, id: t1 }
      - tool_result: { id: t1, name: Read }
      - text: "Still here. Ready when you are."
      - result: { cost_usd: 0.001, num_turns: 1, stop_reason: end_turn }
