# Probes for the M1 event vocabulary — one play per behavior a frontend needs
# to render but cannot provoke on demand from live inference: a run that fails
# mid-flight, a turn cut short by a ceiling, an approval nobody answers, and a
# turn slow enough to cancel.
#
# Deliberately not in scenarios/billing-api.yaml: that one is the readable demo
# of a plausible session, this one is a test instrument.

name: vocabulary
card:
  name: vocabulary
  description: "M1 vocabulary probes (playback)"
defaults:
  delay_ms: 0

plays:
  # A run that dies partway. The tool failure lands before the error, so a
  # consumer can tell "failed after doing some work" from "failed at the gate".
  - match: { contains: "crash the sandbox" }
    events:
      - tool_use: { name: Bash, input: { command: "pytest tests/ -q" }, id: t1 }
      - tool_result:
          id: t1
          name: Bash
          failed: true
          output: "OSError: [Errno 28] No space left on device"
      - error: "the sandbox ran out of disk partway through the test run"

  # An approval the caller walks away from. Short enough that a test can
  # outwait it; a demo would use something a human would actually notice.
  - match: { contains: "deploy to production" }
    events:
      - text: "This one needs your sign-off.\n"
      - permission:
          tool: Bash
          input: { command: "./deploy.sh production" }
          description: "$ ./deploy.sh production"
          timeout_ms: 200
          on_allow:
            - text: "Deployed to production."
            - result: { num_turns: 2, stop_reason: end_turn }
          on_deny:
            - text: "Left production alone."
            - result: { num_turns: 2, stop_reason: end_turn }
          on_timeout:
            - notice: "No answer after 200ms; treating the deploy as declined."
            - text: "Nobody signed off, so production is untouched."
            - result: { num_turns: 2, stop_reason: permission_timeout }

  # A turn slow enough to interrupt. The tool_use lands immediately — it is the
  # signal that the driver is really running — and the delay after it is the
  # window a cancel has to land in. Needs PLAYBACK_SPEED set to mean anything.
  - match: { contains: "take your time" }
    events:
      - tool_use: { name: Bash, input: { command: "sleep 30" }, id: t1 }
      - text: { text: "Finished the long job.", delay_ms: 3000 }
      - result: { num_turns: 1, stop_reason: end_turn }

  # A turn the model stopped early rather than finishing. The answer text is
  # real but partial, which is exactly what stop_reason exists to tell you.
  - match: { contains: "hit the ceiling" }
    events:
      - text: "Here are the first three of the twelve endpoints you asked about"
      - result: { cost_usd: 0.21, num_turns: 1, stop_reason: max_tokens }

  # A plan that moves. Modelled on the real ACP run in a2a-experiments
  # docs/captures/phase5-acp-plan-run.jsonl: three updates to one artifact,
  # each replacing the last, with the in-progress step walking down the list.
  # The claude backend cannot emit any of this today — its plan derivation
  # keys on a TodoWrite tool that no longer exists in the session.
  - match: { contains: "show me the plan" }
    events:
      - plan:
          steps:
            - { content: "Read the failing test", status: in_progress }
            - { content: "Fix the parser", status: pending }
            - { content: "Run the suite", status: pending }
      - text: "The parser drops the trailing field.\n"
      - plan:
          steps:
            - { content: "Read the failing test", status: completed }
            - { content: "Fix the parser", status: pending, priority: high }
            - { content: "Run the suite", status: pending }
      - plan:
          steps:
            - { content: "Read the failing test", status: completed }
            - { content: "Fix the parser", status: completed }
            - { content: "Run the suite", status: completed }
      - result: { num_turns: 3, stop_reason: end_turn }

  # An agent that writes prose instead of a checklist. a2acode carries the
  # markdown through untouched rather than parsing steps out of it.
  - match: { contains: "in prose" }
    events:
      - plan:
          markdown: |
            ## Approach

            Start with the parser, then widen to the callers.
      - result: { num_turns: 1, stop_reason: end_turn }

  # An agent that keeps its plan in a file and just points at it.
  - match: { contains: "plan in a file" }
    events:
      - plan: { uri: "file:///repo/PLAN.md" }
      - result: { num_turns: 1, stop_reason: end_turn }

  # A plan the agent gives up on. The empty plan still replaces the artifact,
  # so a frontend stops showing steps nobody is working on.
  - match: { contains: "abandon the plan" }
    events:
      - plan:
          steps:
            - { content: "Rewrite the scheduler", status: in_progress }
      - text: "That is a bigger change than it looked. Backing out.\n"
      - plan: {}
      - result: { num_turns: 2, stop_reason: end_turn }
