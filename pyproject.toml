[project]
name = "a2a-rig"
version = "0.1.0"
description = "Deterministic A2A dev rig: pytest harness driving a2acode over the real A2A surface"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==1.1.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_rig"]
